# Pre-commit hooks — run fast quality gates before every commit.
# Install once with:  pre-commit install
# Run on demand with: pre-commit run --all-files
#
# Rationale: catching formatting/lint/type issues locally keeps CI green and
# review focused on substance rather than style.
minimum_pre_commit_version: "3.5.0"

default_language_version:
  python: python3.13

repos:
  # ---- Generic hygiene -----------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ---- Python: Ruff (lint + import sort) then Black (format) ---------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.2
    hooks:
      - id: ruff
        name: ruff (lint)
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        # We use Black for formatting; keep ruff-format disabled to avoid conflicts.
        stages: [manual]

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        files: ^backend/

  # ---- Python: static typing ----------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.1
    hooks:
      - id: mypy
        files: ^backend/app/
        additional_dependencies:
          - pydantic>=2.7
        args: ["--config-file=backend/pyproject.toml"]

  # ---- Frontend: lint-staged via local hook --------------------------------
  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend eslint (changed files)
        entry: bash -c 'cd frontend && npx --no-install lint-staged'
        language: system
        files: ^frontend/
        pass_filenames: false
        stages: [pre-commit]
