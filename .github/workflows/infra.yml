name: Infrastructure CI

on:
  push:
    branches: [main]
    paths:
      - "docker-compose*.yml"
      - "Makefile"
      - ".env.example"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "docker-compose*.yml"
      - "Makefile"
      - ".env.example"
      - ".github/workflows/infra.yml"

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Compose & docs consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker compose configuration
        run: docker compose config --quiet
      - name: Ensure FRONTEND_PORT is documented
        run: grep -q "FRONTEND_PORT" .env.example
